<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Nattu logo variations</title>
  <desc id="desc">Four logo directions combining a sprout, garden rows, calendar cues, and the Nattu wordmark.</desc>
  <rect width="1200" height="900" fill="#FBF9F5"/>
  <style>
    .label { fill: #645242; font: 600 22px system-ui, sans-serif; letter-spacing: 1px; }
    .name { fill: #1A4A2E; font: 700 60px system-ui, sans-serif; letter-spacing: -2px; }
    .tagline { fill: #645242; font: 400 19px system-ui, sans-serif; }
    .green { fill: none; stroke: #1A4A2E; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
    .gold { fill: none; stroke: #C8842A; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Variation 1: circular care cycle -->
  <g transform="translate(70 65)">
    <rect width="500" height="350" rx="30" fill="#FFFFFF" stroke="#E7DCCF" stroke-width="2"/>
    <text x="28" y="42" class="label">01 · CARE CYCLE</text>
    <g transform="translate(62 84)">
      <path class="green" d="M85 156a82 82 0 1 1 69-126"/>
      <path class="gold" d="M161 25l-4 39-37-13"/>
      <path class="green" d="M85 151V79"/>
      <path d="M84 99C48 99 37 74 39 50c28-2 49 13 45 49Z" fill="#1A4A2E"/>
      <path d="M87 79c9-31 34-40 58-32-3 27-23 43-58 32Z" fill="#4CAF50"/>
      <path class="gold" d="M47 166h76M56 187h58"/>
    </g>
    <text x="250" y="165" class="name">Nattu</text>
    <text x="252" y="200" class="tagline">Your garden, naturally tended.</text>
  </g>

  <!-- Variation 2: garden calendar -->
  <g transform="translate(630 65)">
    <rect width="500" height="350" rx="30" fill="#FFFFFF" stroke="#E7DCCF" stroke-width="2"/>
    <text x="28" y="42" class="label">02 · GARDEN CALENDAR</text>
    <g transform="translate(62 93)">
      <rect x="5" y="15" width="158" height="158" rx="31" fill="#EDF7F2" stroke="#1A4A2E" stroke-width="12"/>
      <path class="green" d="M47 2v33M121 2v33M9 58h150"/>
      <path class="gold" d="M35 140c24-24 74-24 99 0M45 160c20-17 60-17 80 0"/>
      <path class="green" d="M84 133V80"/>
      <path d="M82 103c-26 0-35-18-34-36 22-1 36 10 34 36Z" fill="#1A4A2E"/>
      <path d="M87 89c7-22 25-29 43-23-2 20-17 31-43 23Z" fill="#4CAF50"/>
    </g>
    <text x="250" y="165" class="name">Nattu</text>
    <text x="252" y="200" class="tagline">Plan · tend · harvest</text>
  </g>

  <!-- Variation 3: Tamil-land-inspired sun and field -->
  <g transform="translate(70 475)">
    <rect width="500" height="350" rx="30" fill="#FFFFFF" stroke="#E7DCCF" stroke-width="2"/>
    <text x="28" y="42" class="label">03 · SUN &amp; SOIL</text>
    <g transform="translate(55 92)">
      <circle cx="86" cy="68" r="55" fill="#FFF8ED" stroke="#C8842A" stroke-width="11"/>
      <path d="M22 126c38-29 91-29 129 0v54H22Z" fill="#1A4A2E"/>
      <path d="M35 150c30-17 72-17 102 0M47 174c23-12 55-12 78 0" fill="none" stroke="#FBF9F5" stroke-width="8" stroke-linecap="round"/>
      <path class="green" d="M86 126V70"/>
      <path d="M84 91c-27 0-36-19-35-38 22-1 38 11 35 38Z" fill="#1A4A2E"/>
      <path d="M89 77c7-23 26-30 45-24-3 21-18 33-45 24Z" fill="#4CAF50"/>
    </g>
    <text x="250" y="165" class="name">Nattu</text>
    <text x="252" y="200" class="tagline">Rooted in local growing.</text>
  </g>

  <!-- Variation 4: compact monogram for app icons -->
  <g transform="translate(630 475)">
    <rect width="500" height="350" rx="30" fill="#FFFFFF" stroke="#E7DCCF" stroke-width="2"/>
    <text x="28" y="42" class="label">04 · APP MONOGRAM</text>
    <g transform="translate(65 88)">
      <rect width="170" height="170" rx="46" fill="#1A4A2E"/>
      <path d="M48 132V67l75 65V58" fill="none" stroke="#FBF9F5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M122 62c3-28 20-42 43-41 1 24-14 41-43 41Z" fill="#C8842A"/>
      <path d="M122 62c-28 0-41-16-41-39 24-1 41 13 41 39Z" fill="#A5D6A7"/>
    </g>
    <text x="275" y="155" class="name">Nattu</text>
    <text x="277" y="190" class="tagline">Simple at any size.</text>
  </g>
</svg>
